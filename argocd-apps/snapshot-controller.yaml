apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snapshot-controller
  namespace: argocd

spec:
  project: default

  sources:
    # 🔹 Upstream Helm chart (CSI snapshot CRDs + controller + VolumeSnapshotClass)
    - repoURL: https://piraeus.io/helm-charts/
      chart: snapshot-controller
      targetRevision: 5.4.0
      helm:
        releaseName: snapshot-controller
        valueFiles:
          - $values/charts/snapshot-controller/values.yaml

    # 🔹 Your Git repo (values source)
    - repoURL: https://github.com/harish2k01/homelab-ops
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: snapshot-controller

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true

  revisionHistoryLimit: 3
