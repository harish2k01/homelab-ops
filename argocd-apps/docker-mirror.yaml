apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: docker-mirror
  namespace: argocd
spec:
  project: default
  # Docker Hub pull-through cache for the dind daemons in the self-hosted CI runners.
  source:
    repoURL: https://github.com/harish2k01/homelab-ops
    targetRevision: main
    path: manifests/docker-mirror
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  revisionHistoryLimit: 3
