apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ghost
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://harish2k01.github.io/helm-charts
      chart: ghost
      targetRevision: 0.2.0
      helm:
        releaseName: ghost
        valueFiles:
          - $values/charts/ghost/values.yaml
    - repoURL: https://github.com/harish2k01/homelab-ops
      targetRevision: main
      ref: values
    - repoURL: https://github.com/harish2k01/homelab-ops
      targetRevision: main
      path: manifests/ghost
  destination:
    server: https://kubernetes.default.svc
    namespace: ghost
  # StatefulSet claim-template labels are immutable. Chart version labels may
  # change without replacing the database or its persistent volume.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: ghost-mysql
      jsonPointers:
        - /spec/volumeClaimTemplates/0/metadata/labels
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  revisionHistoryLimit: 3
