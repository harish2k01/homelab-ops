apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: umami
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://harish2k01.github.io/helm-charts
      chart: umami
      targetRevision: 0.2.0
      helm:
        releaseName: umami
        valueFiles:
          - $values/charts/umami/values.yaml
    - repoURL: https://github.com/harish2k01/homelab-ops
      targetRevision: main
      ref: values
    - repoURL: https://github.com/harish2k01/homelab-ops
      targetRevision: main
      path: manifests/umami
  destination:
    server: https://kubernetes.default.svc
    namespace: umami
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  revisionHistoryLimit: 3
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: umami-db
      jsonPointers:
        - /spec/volumeClaimTemplates/0/metadata/labels/helm.sh~1chart
        - /spec/volumeClaimTemplates/0/metadata/labels/app.kubernetes.io~1version
