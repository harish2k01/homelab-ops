apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: profilarr
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: oci://ghcr.io/harish2k01/helm-charts/profilarr
      targetRevision: 0.1.0
      path: .
      helm:
        releaseName: profilarr
        valueFiles:
          - $values/charts/profilarr/values.yaml
    - repoURL: https://github.com/harish2k01/homelab-ops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 3
