apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-operator
  namespace: argocd

spec:
  project: default

  sources:
    # Upstream Helm chart
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.8.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/charts/external-secrets-operator/values.yaml

    # Git repository containing the values
    - repoURL: https://github.com/harish2k01/homelab-ops
      targetRevision: main
      ref: values

    # Git repository containing additional manifests
    - repoURL: https://github.com/harish2k01/homelab-ops
      targetRevision: main
      path: manifests/external-secrets-operator

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets-operator

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

  revisionHistoryLimit: 3
