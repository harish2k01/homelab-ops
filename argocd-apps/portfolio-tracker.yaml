apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-tracker
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://harish2k01.github.io/helm-charts
      chart: portfolio-tracker
      targetRevision: 0.2.0
      helm:
        releaseName: portfolio-tracker
        valueFiles:
          - $values/charts/portfolio-tracker/values.yaml
    - repoURL: https://github.com/harish2k01/homelab-ops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio-tracker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  revisionHistoryLimit: 3
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: portfolio-tracker-db
      jsonPointers:
        - /spec/volumeClaimTemplates/0/metadata/labels/helm.sh~1chart
        - /spec/volumeClaimTemplates/0/metadata/labels/app.kubernetes.io~1version
