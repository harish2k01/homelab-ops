apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tech-bytes-playground-gh-runner-scale-set
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
      targetRevision: 0.14.0
      path: .
      helm:
        releaseName: tech-bytes-playground-runner-set
        valueFiles:
          - $values/charts/actions-runner-controller/gha-runner-scale-set/tech-bytes-playground-values.yaml
    - repoURL: https://github.com/harish2k01/homelab-ops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  revisionHistoryLimit: 3
