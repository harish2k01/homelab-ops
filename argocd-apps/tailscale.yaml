apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://harish2k01.github.io/helm-charts
      chart: tailscale
      targetRevision: 0.1.4
      helm:
        releaseName: tailscale
        valueFiles:
          - $values/charts/tailscale/values.yaml
    - repoURL: https://github.com/harish2k01/homelab-ops
      targetRevision: main
      ref: values
    - repoURL: https://github.com/harish2k01/homelab-ops
      targetRevision: main
      path: manifests/tailscale
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: tailscale
      namespace: tailscale
      jsonPointers:
        - /spec/template/spec/containers/0/env/4/value
    - group: apps
      kind: StatefulSet
      name: tailscale
      namespace: tailscale
      jsonPointers:
        - /spec/volumeClaimTemplates/0/metadata/labels/helm.sh~1chart
        - /spec/volumeClaimTemplates/0/metadata/labels/app.kubernetes.io~1version
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
  revisionHistoryLimit: 3
