apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-k8s
  namespace: traefik
spec:
  secretName: wildcard-k8s-tls
  dnsNames:
    - harish2k01.xyz
    - "*.harish2k01.xyz"
    - "*.k8s.harish2k01.xyz"
    - harish2k01.in
    - "*.harish2k01.in"

    - "*.k8s.harish2k01.in"
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
