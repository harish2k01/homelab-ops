# Docker Hub pull-through cache (CNCF distribution in proxy mode) for the dind daemons in
# self-hosted CI runners. Nothing can be pushed; cached content expires after two weeks unused.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: docker-mirror-storage
  labels:
    app.kubernetes.io/name: docker-mirror
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-mirror
  labels:
    app.kubernetes.io/name: docker-mirror
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: docker-mirror
      app.kubernetes.io/instance: docker-mirror
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docker-mirror
        app.kubernetes.io/instance: docker-mirror
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: registry:3.1.2
          imagePullPolicy: IfNotPresent
          env:
            - name: REGISTRY_PROXY_REMOTEURL
              value: https://registry-1.docker.io
            - name: REGISTRY_PROXY_TTL
              value: 336h
            - name: REGISTRY_HTTP_ADDR
              value: ":5000"
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
            - name: OTEL_TRACES_EXPORTER
              value: none
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: storage
              mountPath: /var/lib/registry
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: docker-mirror-storage
---
apiVersion: v1
kind: Service
metadata:
  name: docker-mirror
  labels:
    app.kubernetes.io/name: docker-mirror
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: docker-mirror
    app.kubernetes.io/instance: docker-mirror
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP
