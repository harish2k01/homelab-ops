image:
  repository: ghcr.io/analogj/scrutiny
  tag: v0.9.2-web
  pullPolicy: IfNotPresent

influxdb:
  image:
    repository: influxdb
    tag: "2.8"
    pullPolicy: IfNotPresent
  resources: {}

service:
  port: 8080

scrutiny:
  web:
    basepath: ""
    database:
      location: /opt/scrutiny/config/scrutiny.db
    influxdb:
      scheme: http
      host: 127.0.0.1
      port: 8086
      retentionPolicy: true
  log:
    file: ""
    level: INFO
  notify:
    urls: []

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  storageClassName: longhorn
  scrutiny:
    size: 1Gi
  influxdb:
    size: 2Gi

ingress:
  enabled: false
  className: traefik
  annotations: {}
  host: scrutiny.local

httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - scrutiny.k8s.harish2k01.xyz

resources: {}

probes:
  enabled: true
initContainer:
  image:
    tag: "1.36"
deploymentStrategy:
  type: Recreate
envFrom: []

# Upgrade/configuration notes for chart 0.2.4:
# InfluxDB stays at the current 2.8 tag; this update does not opt into the newer chart database image.
# deploymentStrategy.type: Recreate prevents two sidecar database writers sharing a PVC; expect brief downtime.
# New influxdb.env/envFrom/extraEnv/args and app env/envFrom/extraEnv are optional. Keep credentials in Secrets.
# The init image stays on the existing stable version; existing scrutiny.yaml is preserved rather than overwritten.
# Full supported runtime options: https://github.com/harish2k01/helm-charts/blob/main/charts/scrutiny/values.yaml
# App/chart changes: https://github.com/harish2k01/helm-charts/blob/main/charts/scrutiny/CHANGELOG.md
