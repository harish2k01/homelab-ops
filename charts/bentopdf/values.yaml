replicaCount: 1

image:
  repository: ghcr.io/alam00000/bentopdf-simple
  pullPolicy: IfNotPresent
  tag: "2.8.10"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

httpRoutes:
  internal:
    enabled: true
    annotations: {}
    parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
    hostnames:
    - bentopdf.k8s.harish2k01.xyz
    rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
  external:
    enabled: true
    parentRefs:
    - name: traefik-external-gateway
      namespace: traefik
      sectionName: websecure
    - name: traefik-external-gateway
      namespace: traefik
      sectionName: web
    hostnames:
    - bentopdf.harish2k01.xyz

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
envFrom: []
