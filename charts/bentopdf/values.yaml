replicaCount: 1

image:
  repository: ghcr.io/alam00000/bentopdf-simple
  pullPolicy: IfNotPresent
  tag: "2.8.10"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - bentopdf.k8s.harish2k01.xyz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
envFrom: []

# Upgrade/configuration notes for chart 0.2.0:
# Optional env.ROBOTS_NOINDEX: "true" adds noindex metadata at startup and needs writable bundled HTML.
# env.PORT must match service.targetPort; SITE_URL and branding settings require a custom image build.
# Full supported runtime options: https://github.com/harish2k01/helm-charts/blob/main/charts/bentopdf/values.yaml
# App/chart changes: https://github.com/harish2k01/helm-charts/blob/main/charts/bentopdf/CHANGELOG.md
