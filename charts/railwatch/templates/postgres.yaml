{{- if .Values.postgres.enabled }}
{{- $fullName := include "railwatch.fullname" . -}}
{{- $ready := list "pg_isready" "-U" .Values.postgres.user "-d" .Values.postgres.database -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "railwatch.labels" (list . "database") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  clusterIP: None
  selector:
    {{- include "railwatch.selectorLabels" (list . "database") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullName }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "railwatch.labels" (list . "database") | nindent 4 }}
  annotations:
    # Ready before migrations and application pods in the same sync.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  serviceName: {{ $fullName }}-postgres
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "railwatch.selectorLabels" (list . "database") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "railwatch.labels" (list . "database") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: {{ include "railwatch.secretName" . }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          startupProbe:
            exec:
              command: {{ toJson $ready }}
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            exec:
              command: {{ toJson $ready }}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: {{ toJson $ready }}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ required "postgres.existingClaim must name the database claim" .Values.postgres.existingClaim }}
        - name: tmp
          emptyDir: {}
      {{- include "railwatch.scheduling" . | nindent 6 }}
{{- end }}
