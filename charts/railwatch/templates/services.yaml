{{- $fullName := include "railwatch.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "railwatch.labels" (list . "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "railwatch.selectorLabels" (list . "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "railwatch.labels" (list . "backend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "railwatch.selectorLabels" (list . "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
      protocol: TCP
