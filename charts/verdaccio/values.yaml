# Values for the upstream verdaccio/verdaccio chart, used by argocd-apps/verdaccio.yaml as an
# in-cluster npm cache for self-hosted CI runners in arc-systems. The cache is disposable: losing the
# volume only means the next run downloads packages from npmjs again.
revisionHistoryLimit: 3

# One pod owns the RWO volume, so replace it rather than surge.
strategy:
  type: Recreate

# First start on a new volume can take over a minute, and parsing a very large package
# document blocks Verdaccio's event loop for seconds at a time: only restart it after two
# minutes of no response.
livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 6
readinessProbe:
  initialDelaySeconds: 10
  timeoutSeconds: 10
  failureThreshold: 6

# Verdaccio keeps and parses full npm package documents, and some are huge (@prisma/client is
# ~70MB, several @prisma/@typescript-eslint/typescript documents are 12-35MB). Several runners
# installing at once parse them concurrently: 512Mi and then 2Gi were OOM-killed. Keep the V8
# heap below the limit so Node collects garbage instead of the kernel killing the pod.
resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

extraEnvVars:
  - name: VERDACCIO_PORT
    value: "4873"
  - name: NODE_OPTIONS
    value: --max-old-space-size=3072

podSecurityContext:
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsUser: 10001
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

persistence:
  enabled: true
  storageClass: longhorn
  size: 8Gi

# Read-only proxy of registry.npmjs.org: nobody can log in or publish.
configMap: |
  storage: /verdaccio/storage/data
  auth:
    htpasswd:
      file: /verdaccio/storage/htpasswd
      max_users: -1
  uplinks:
    npmjs:
      url: https://registry.npmjs.org/
      # Reuse package metadata for 10 minutes before asking npmjs again.
      maxage: 10m
      timeout: 60s
  packages:
    "**":
      access: $all
      publish: $nobody
      unpublish: $nobody
      proxy: npmjs
  # Forward `npm audit` requests to npmjs for runners that use this registry.
  middlewares:
    audit:
      enabled: true
  server:
    keepAliveTimeout: 60
  web:
    enable: false
  log:
    type: stdout
    format: json
    level: warn
