apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "firefly-mcp.fullname" . }}-data
  labels:
    {{- include "firefly-mcp.labels" . | nindent 4 }}
  annotations:
    # Keep import history and OAuth tokens if the app is removed.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "firefly-mcp.fullname" . }}
  labels:
    {{- include "firefly-mcp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "firefly-mcp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- range $key, $route := .Values.httpRoutes }}
{{- if $route.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "firefly-mcp.fullname" $ }}-{{ $key }}
  labels:
    {{- include "firefly-mcp.labels" $ | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml $route.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml $route.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "firefly-mcp.fullname" $ }}
          port: {{ $.Values.service.port }}
{{- end }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "firefly-mcp.fullname" . }}
  labels:
    {{- include "firefly-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "firefly-mcp.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
      ports:
        - port: http
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.firefly.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.firefly.podLabels | nindent 14 }}
      ports:
        - port: {{ .Values.networkPolicy.firefly.port }}
{{- end }}
