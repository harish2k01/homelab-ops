podSecurityContext:
  fsGroup: 1000

env:
  PUID: "1000"
  PGID: "1000"
  TZ: Asia/Kolkata

persistence:
  config:
    enabled: true
    size: 512Mi
    storageClassName: longhorn

media:
  enabled: true
  existingClaim: media-vault-pvc
  mountPath: /vault
  readOnly: false

httpRoutes:
  internal:
    enabled: true
    parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
    hostnames:
    - sonarr-anime.k8s.harish2k01.xyz

resources: {}
envFrom: []
