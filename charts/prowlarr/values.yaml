podSecurityContext:
  fsGroup: 1000

env:
  PUID: "1000"
  PGID: "1000"
  TZ: Asia/Kolkata

persistence:
  config:
    enabled: true
    size: 256Mi
    storageClassName: longhorn

httpRoute:
  enabled: true
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - prowlarr.k8s.harish2k01.xyz

resources: {}
envFrom: []

# Upgrade/configuration notes for chart 0.2.0:
# Optional env.PROWLARR__SERVER__ALLOWEDHOSTS and PROWLARR__SERVER__TRUSTEDNETWORKS accept deployment-specific host/network lists.
# Use envFrom for external database credentials. Updated health probes use Host: localhost; indexer settings remain app-owned.
# Full supported runtime options: https://github.com/harish2k01/helm-charts/blob/main/charts/prowlarr/values.yaml
# App/chart changes: https://github.com/harish2k01/helm-charts/blob/main/charts/prowlarr/CHANGELOG.md
