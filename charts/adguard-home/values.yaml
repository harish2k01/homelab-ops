replicaCount: 1

image:
  repository: adguard/adguardhome
  tag: "v0.107.79"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  annotations:
    metallb.universe.tf/loadBalancerIPs: 10.10.10.251
  externalTrafficPolicy: Local
  ports:
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP

containerPorts:
  - name: http
    containerPort: 80
    protocol: TCP
  - name: http-setup
    containerPort: 3000
    protocol: TCP
  - name: dns-tcp
    containerPort: 53
    protocol: TCP
  - name: dns-udp
    containerPort: 53
    protocol: UDP

persistence:
  accessModes:
    - ReadWriteOnce
  size: 512Mi
  storageClassName: longhorn
  work:
    mountPath: /opt/adguardhome/work
    subPath: work
  conf:
    mountPath: /opt/adguardhome/conf
    subPath: conf

livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

resources: {}
envFrom: []

# Upgrade/configuration notes for chart 0.1.3:
# Large filter lists now have a 256 MB default download limit. Adjust filtering.max_http_size in the app-owned AdGuardHome.yaml only if needed.
# Keep work/conf on the existing PVC; do not mount a read-only replacement over the writable configuration.
# Full supported runtime options: https://github.com/harish2k01/helm-charts/blob/main/charts/adguard-home/values.yaml
# App/chart changes: https://github.com/harish2k01/helm-charts/blob/main/charts/adguard-home/CHANGELOG.md
