env:
  LOG_LEVEL: info
  LOG_HTML: "false"
  CAPTCHA_SOLVER: none
  TZ: Asia/Kolkata

persistence:
  config:
    enabled: false

httpRoute:
  enabled: false

resources: {}
envFrom: []

# Upgrade/configuration notes for chart 0.1.3:
# Optional env.BROWSER_WAIT_TIMEOUT: "3" helps slow hosts; upstream default "1" preserves the previous wait.
# Use envFrom for proxy credentials. Optional file logs require a writable mounted destination; API request fields are not global env settings.
