image:
  repository: quay.io/prometheuscommunity/smartctl-exporter
  tag: v0.14.0
  pullPolicy: IfNotPresent
# NFD sets this automatically; unclassified nodes remain excluded.
nodeSelector:
  feature.node.kubernetes.io/cpu-model.hypervisor: none
tolerations:
  - operator: Exists
    effect: NoSchedule
collectionInterval: 300s
discoveryIntervalSeconds: 300
extended:
  image:
    repository: python
    tag: 3.13.7-alpine3.22
  resources:
    requests: {cpu: 5m, memory: 32Mi}
    limits: {memory: 128Mi}
serviceMonitor:
  interval: 60s
  scrapeTimeout: 30s
  labels:
    release: kube-prometheus-stack
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
