# Physical SATA boot SSDs verified with talosctl get disks.
# Explicit selection avoids collecting Longhorn iSCSI virtual volumes.
config:
  devices:
    - /dev/sda
common:
  config:
    collect_not_more_than_period: 300s
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [hermes, athena]
tolerations:
  - operator: Exists
    effect: NoSchedule
serviceMonitor:
  enabled: true
  extraLabels:
    release: kube-prometheus-stack
  interval: 60s
  scrapeTimeout: 30s
  relabelings:
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node
# Custom rules also cover missing SMART data and SATA raw attributes.
prometheusRules:
  enabled: false
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
