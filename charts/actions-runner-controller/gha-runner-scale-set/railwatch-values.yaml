# Dedicated runner for railwatch database/browser validation, releases and image builds.
githubConfigUrl: https://github.com/harish2k01/railwatch
githubConfigSecret: arc-github-app
runnerScaleSetName: railwatch-runner
minRunners: 0
# Each PR runs checks, e2e and container jobs in parallel; releases add one more.
maxRunners: 5
# PostgreSQL service containers and Buildx builds need a Docker daemon. This is the pod the
# chart generates for containerMode "dind", written out so dockerd can use the in-cluster
# Docker Hub mirror (charts' dind mode does not accept extra dockerd arguments).
# No mounted Kubernetes credentials or persistent workspace in the runner.
template:
  spec:
    automountServiceAccountToken: false
    initContainers:
      - name: init-dind-externals
        image: ghcr.io/harish2k01/railwatch-runner@sha256:109bb55848b23e43bee2368f8c6359e5c1cd452b933e8929de7bc8552e3c5388
        command: ["cp"]
        args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
      # Native sidecar: starts before the runner and stops after it.
      - name: dind
        image: docker:29.9.3-dind
        restartPolicy: Always
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
          - --registry-mirror=http://zot.zot.svc.cluster.local:5000
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        startupProbe:
          exec:
            command: ["docker", "info"]
          failureThreshold: 24
          periodSeconds: 5
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
    containers:
      - name: runner
        # Prebuilt RailWatch runner (images/railwatch-runner, tag latest-55cb2ec): workflow tools,
        # Node 24 in the tool cache and Chromium with its system libraries preinstalled. The
        # init container above copies externals from the same image.
        image: ghcr.io/harish2k01/railwatch-runner@sha256:109bb55848b23e43bee2368f8c6359e5c1cd452b933e8929de7bc8552e3c5388
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
          # In-cluster npm cache (Verdaccio); npm rewrites lockfile registry.npmjs.org URLs to it.
          - name: NPM_CONFIG_REGISTRY
            value: http://verdaccio.arc-systems.svc.cluster.local:4873/
        # Requests reserve real capacity so the scheduler spreads parallel jobs across nodes;
        # at 500m several runners stacked on one node and unit tests ran ~300x slower and timed out.
        resources:
          requests:
            cpu: "1500m"
            memory: "2Gi"
          limits:
            cpu: "3"
            memory: "4Gi"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
    volumes:
      - name: work
        emptyDir: {}
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller
