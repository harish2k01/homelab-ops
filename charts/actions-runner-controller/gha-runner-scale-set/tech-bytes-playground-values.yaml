# Custom DinD template: inherit the Kubernetes pod MTU for default and job bridges.
# Keep containerMode empty so ARC does not inject a second Docker sidecar.
githubConfigUrl: https://github.com/harish2k01/tech-bytes-playground
githubConfigSecret: arc-github-app
runnerScaleSetName: tech-bytes-playground-runner
minRunners: 0
maxRunners: 3
containerMode: {}
template:
  spec:
    automountServiceAccountToken: false
    restartPolicy: Never
    initContainers:
    - name: init-dind-externals
      image: ghcr.io/actions/actions-runner:latest
      command:
      - cp
      args:
      - -r
      - /home/runner/externals/.
      - /home/runner/tmpDir/
      volumeMounts:
      - name: dind-externals
        mountPath: /home/runner/tmpDir
    - name: dind
      image: docker:dind
      args:
      - |
        set -eu
        mtu=$(cat /sys/class/net/eth0/mtu)
        exec /usr/local/bin/dockerd-entrypoint.sh dockerd \
          --host=unix:///var/run/docker.sock \
          --group="$DOCKER_GROUP_GID" \
          --mtu="$mtu" \
          --default-network-opt="bridge=com.docker.network.driver.mtu=$mtu"
      env:
      - name: DOCKER_GROUP_GID
        value: '123'
      securityContext:
        privileged: true
      restartPolicy: Always
      startupProbe:
        exec:
          command:
          - docker
          - info
        initialDelaySeconds: 0
        failureThreshold: 24
        periodSeconds: 5
      volumeMounts:
      - name: work
        mountPath: /home/runner/_work
      - name: dind-sock
        mountPath: /var/run
      - name: dind-externals
        mountPath: /home/runner/externals
      command:
      - sh
      - -c
    containers:
    - name: runner
      command:
      - /home/runner/run.sh
      image: ghcr.io/actions/actions-runner:latest
      resources:
        limits:
          cpu: '1'
          memory: 2Gi
        requests:
          cpu: 500m
          memory: 1Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      env:
      - name: DOCKER_HOST
        value: unix:///var/run/docker.sock
      - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
        value: '120'
      volumeMounts:
      - name: work
        mountPath: /home/runner/_work
      - name: dind-sock
        mountPath: /var/run
    volumes:
    - name: dind-sock
      emptyDir: {}
    - name: dind-externals
      emptyDir: {}
    - name: work
      emptyDir: {}
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller
