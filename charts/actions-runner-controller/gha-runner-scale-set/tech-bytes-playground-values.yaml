# Dedicated runner for tech-bytes-playground Ghost theme validation, packaging and releases.
githubConfigUrl: https://github.com/harish2k01/tech-bytes-playground
githubConfigSecret: arc-github-app
runnerScaleSetName: tech-bytes-playground-runner
minRunners: 0
maxRunners: 3
# Docker remains available for builds; workflow steps run directly in the runner.
containerMode:
  type: dind
# Match existing ARC runners: sudo installs workflow dependencies inside the ephemeral runner.
# No mounted Kubernetes credentials or persistent workspace in the runner.
template:
  spec:
    automountServiceAccountToken: false
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller
