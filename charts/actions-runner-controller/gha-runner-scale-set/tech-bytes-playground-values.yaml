# Runner for the tech-bytes-playground theme build and release (Node 24, npm, gh; no Docker).
githubConfigUrl: https://github.com/harish2k01/tech-bytes-playground
githubConfigSecret: arc-github-app
runnerScaleSetName: tech-bytes-playground-runner
minRunners: 0
maxRunners: 3
# No Docker daemon or mounted Kubernetes credentials in the runner.
template:
  spec:
    automountServiceAccountToken: false
    containers:
      - name: runner
        # General runner image (images/ci-runner): apt tools and Node 22/24/26 preinstalled.
        image: ghcr.io/harish2k01/ci-runner@sha256:4472659126f6be8f2de1146f7de673cb4300b8b0c3832758d09cab46a444c826
        command: ["/home/runner/run.sh"]
        env:
          # In-cluster npm cache (Verdaccio); npm rewrites lockfile registry.npmjs.org URLs to it.
          - name: NPM_CONFIG_REGISTRY
            value: http://verdaccio.verdaccio.svc.cluster.local:4873/
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1500m"
            memory: "2.5Gi"
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller
