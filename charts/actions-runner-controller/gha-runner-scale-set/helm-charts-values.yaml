# Runner for helm-charts lint and release (helm, Node 26, npm, gnupg; no Docker).
githubConfigUrl: https://github.com/harish2k01/helm-charts
githubConfigSecret: arc-github-app
runnerScaleSetName: helm-charts-runner
minRunners: 0
maxRunners: 3
# No Docker daemon or mounted Kubernetes credentials in the runner.
template:
  spec:
    automountServiceAccountToken: false
    containers:
      - name: runner
        # General runner image (images/ci-runner): apt tools and Node 22/24/26 preinstalled.
        image: ghcr.io/harish2k01/ci-runner:latest
        imagePullPolicy: Always
        command: ["/home/runner/run.sh"]
        env:
          # In-cluster npm cache (Verdaccio); npm rewrites lockfile registry.npmjs.org URLs to it.
          - name: NPM_CONFIG_REGISTRY
            value: http://verdaccio.verdaccio.svc.cluster.local:4873/
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1500m"
            memory: "2.5Gi"
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller
