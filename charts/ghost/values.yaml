replicaCount: 1

image:
  repository: ghost
  tag: "6.75.0-alpine@sha256:3af1575bb8917c6c0057beff85db92a4ac650f726956fd9de96932fea01c397c"
  pullPolicy: IfNotPresent

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

deployment:
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  terminationGracePeriodSeconds: 150

env:
  url: https://harish2k01.in
  NODE_ENV: production
  mail__transport: SMTP
  mail__options__host: smtp.gmail.com
  mail__options__port: "587"
  mail__options__auth__user: harish.techinsights@gmail.com
  mail__from: Tech Insights
  database__client: mysql
  database__connection__host: ghost-mysql8
  database__connection__port: "3306"
  database__connection__user: ghost
  database__connection__database: ghost

secretEnv:
  existingSecret:
    name: ghost-secret
    keys:
    - envName: mail__options__auth__pass
      secretKey: mail__options__auth__pass
      optional: false

mysql:
  enabled: false

persistence:
  content:
    enabled: true
    accessModes:
    - ReadWriteOnce
    size: 2Gi
    storageClassName: longhorn
    existingClaim: ghost-content-migrated-20261106

service:
  type: ClusterIP
  port: 2368

ingress:
  enabled: false

httpRoutes:
  internal:
    enabled: true
    parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
    hostnames:
    - ghost.k8s.harish2k01.xyz
  external:
    enabled: true
    parentRefs:
    - name: traefik-external-gateway
      namespace: traefik
      sectionName: websecure
    - name: traefik-external-gateway
      namespace: traefik
      sectionName: web
    hostnames:
    - harish2k01.in
    - www.harish2k01.in

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 768Mi

startupProbe:
  httpGet: null
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

livenessProbe:
  httpGet: null
  tcpSocket:
    port: http
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet: null
  tcpSocket:
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

# Route Network / Social Web requests to Ghost's hosted ActivityPub service.
activityPub:
  enabled: true
  target: https://ap.ghost.org
extraEnv:
- name: database__connection__password
  valueFrom:
    secretKeyRef:
      name: ghost-mysql8-secret
      key: db-password
