podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

env:
  TZ: Asia/Kolkata
  ORIGIN: https://profilarr.k8s.harish2k01.xyz
  AUTH: "on"

persistence:
  config:
    enabled: true
    size: 512Mi
    storageClassName: longhorn

# Enables release parsing and profile simulations in the UI.
parser:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

httpRoute:
  enabled: true
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - profilarr.k8s.harish2k01.xyz

resources:
  requests:
    cpu: 100m
    memory: 256Mi
envFrom: []
startupProbe:
  tcpSocket:
    port: http
  periodSeconds: 5
  failureThreshold: 60

# Upgrade/configuration notes for chart 0.1.1:
# The chart adds reference material without changing the deployed app/parser version.
# Preserve existing parser endpoint/authentication and config PVC; optional upstream settings remain opt-in.
# Full supported runtime options: https://github.com/harish2k01/helm-charts/blob/main/charts/profilarr/values.yaml
# App/chart changes: https://github.com/harish2k01/helm-charts/blob/main/charts/profilarr/CHANGELOG.md
