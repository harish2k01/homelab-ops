# Environment overrides for helm-charts/portfolio-next (published chart 0.1.0).
replicaCount: 2
image:
  repository: ghcr.io/harish2k01/portfolio-next
  tag: v0.3.9
  # The release workflow fills this with the verified image index digest.
  digest: "sha256:b91434bd0029cfd744b77add2bd83ac97e46f629c3ee5148ac9fdaa9e2ac0596"
  pullPolicy: IfNotPresent
httpRoute:
  enabled: true
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - harish2k01.xyz
    - portfolio.k8s.harish2k01.xyz
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi
