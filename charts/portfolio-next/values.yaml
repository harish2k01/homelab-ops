# Environment overrides for helm-charts/portfolio-next (published chart 0.1.0).
replicaCount: 2
image:
  repository: ghcr.io/harish2k01/portfolio-next
  tag: v0.3.1
  # The release workflow fills this with the verified image index digest.
  digest: "sha256:60190a445dbd1eea85c8349800b7825b1b981f9e1414e86dbe7a5eabcd578cfd"
  pullPolicy: IfNotPresent
httpRoute:
  enabled: true
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - harish2k01.xyz
    - portfolio.k8s.harish2k01.xyz
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi
