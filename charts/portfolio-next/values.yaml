# Environment overrides for helm-charts/portfolio-next (published chart 0.1.0).
replicaCount: 2
image:
  repository: ghcr.io/harish2k01/portfolio-next
  tag: v0.3.5
  # The release workflow fills this with the verified image index digest.
  digest: "sha256:3bd72d7fb1289cfaa6215faef002e7a9f1fe19591166d4d5a7f6b098443c40e3"
  pullPolicy: IfNotPresent
httpRoute:
  enabled: true
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - harish2k01.xyz
    - portfolio.k8s.harish2k01.xyz
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi
