# Environment overrides for helm-charts/portfolio-next (published chart 0.1.0).
replicaCount: 2
image:
  repository: ghcr.io/harish2k01/portfolio-next
  tag: v0.3.3
  # The release workflow fills this with the verified image index digest.
  digest: "sha256:98d5d78f1137c744e8ca85791f7c0281c58948e65b6ea9a6de6a2294d3e017b9"
  pullPolicy: IfNotPresent
httpRoute:
  enabled: true
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - harish2k01.xyz
    - portfolio.k8s.harish2k01.xyz
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi
