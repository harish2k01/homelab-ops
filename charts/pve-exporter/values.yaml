image:
  repository: prompve/prometheus-pve-exporter
  tag: "3.10.1"
  pullPolicy: IfNotPresent

proxmox:
  # One or more Proxmox API endpoints to scrape.
  targets:
    - 10.10.10.100
  config:
    existingSecret: pve-exporter
    secretKey: pve.yaml
    enabled: true

service:
  type: ClusterIP
  port: 9221
  targetPort: 9221

serviceMonitor:
  enabled: true
  interval: 15s
  labels:
    release: kube-prometheus-stack
collectors:
  qdevice: false
envFrom: []

# Upgrade/configuration notes for chart 0.2.0:
# The upstream QDevice collector is new. It is disabled here until its Proxmox API permissions/use are verified.
# Keep proxmox.config.enabled true for the existing Secret-backed pve.yml. Environment-only auth can disable it and use envFrom.
# Optional extraArgs exposes collector flags; verify real scrapes after rollout.
# Full supported runtime options: https://github.com/harish2k01/helm-charts/blob/main/charts/pve-exporter/values.yaml
# App/chart changes: https://github.com/harish2k01/helm-charts/blob/main/charts/pve-exporter/CHANGELOG.md
