image:
  repository: prompve/prometheus-pve-exporter
  tag: "3.10.1"
  pullPolicy: IfNotPresent

proxmox:
  # One or more Proxmox API endpoints to scrape.
  targets:
    - 10.10.10.100
  config:
    existingSecret: pve-exporter
    secretKey: pve.yaml
    enabled: true

service:
  type: ClusterIP
  port: 9221
  targetPort: 9221

serviceMonitor:
  enabled: true
  interval: 15s
  labels:
    release: kube-prometheus-stack
collectors:
  qdevice: false
envFrom: []
