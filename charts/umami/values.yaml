replicaCount: 1

image:
  repository: ghcr.io/umami-software/umami
  tag: "3.4.0"
  pullPolicy: IfNotPresent

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

ingress:
  enabled: false

httpRoute:
  enabled: true
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - umami.harish2k01.xyz

database:
  postgresql:
    enabled: true
    image:
      repository: postgres
      pullPolicy: IfNotPresent
      tag: "15-alpine"
    auth:
      database: umami
      username: umami
      existingSecret: umami-postgresql-secret
      passwordKey: db-password
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: 1Gi
      storageClassName: longhorn
      # Immutable identity of the existing claims; keep these labels fixed.
      claimTemplateLabels:
        app.kubernetes.io/instance: umami
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: umami
        app.kubernetes.io/version: 3.1.0
        helm.sh/chart: umami-0.1.0
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch

  external:
    enabled: false

umami:
  secrets:
    existingSecret: umami-app-secret
    appSecretKey: APP_SECRET
    rolloutToken: "1"
    inline:
      APP_SECRET: ""
  env:
    PORT: "3000"
    DISABLE_TELEMETRY: "1"
    APP_URL: https://umami.harish2k01.xyz
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  extraEnv: []

nodeSelector: {}
tolerations: []
affinity: {}
startupProbe:
  httpGet:
    path: /api/heartbeat
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 120
