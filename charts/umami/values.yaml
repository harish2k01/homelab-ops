replicaCount: 1

image:
  repository: ghcr.io/umami-software/umami
  tag: "3.4.0"
  pullPolicy: IfNotPresent

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

ingress:
  enabled: false

httpRoute:
  enabled: true
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - umami.harish2k01.xyz

database:
  postgresql:
    enabled: true
    image:
      repository: postgres
      pullPolicy: IfNotPresent
      tag: "15-alpine"
    auth:
      database: umami
      username: umami
      existingSecret: umami-postgresql-secret
      passwordKey: db-password
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: 1Gi
      storageClassName: longhorn
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch

  external:
    enabled: false

umami:
  secrets:
    existingSecret: umami-app-secret
    appSecretKey: APP_SECRET
    rolloutToken: "1"
    inline:
      APP_SECRET: ""
  env:
    PORT: "3000"
    DISABLE_TELEMETRY: "1"
    APP_URL: https://umami.harish2k01.xyz
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  extraEnv: []

nodeSelector: {}
tolerations: []
affinity: {}
startupProbe:
  httpGet:
    path: /api/heartbeat
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 120

# Upgrade/configuration notes for chart 0.2.0:
# startupProbe protects up to 20 minutes of migrations. Preserve APP_SECRET and back up PostgreSQL; the current 15-alpine server stays pinned.
# To enable TOTP, supply a stable 64-hex TWO_FACTOR_ENCRYPTION_KEY via umami.extraEnv secretKeyRef or the existing Secret import.
# Optional umami.env.MCP_ENABLED: "1" enables API-key-authenticated /mcp; it is not enabled here.
# Full supported runtime options: https://github.com/harish2k01/helm-charts/blob/main/charts/umami/values.yaml
# App/chart changes: https://github.com/harish2k01/helm-charts/blob/main/charts/umami/CHANGELOG.md
