podSecurityContext:
  fsGroup: 1000
  supplementalGroups:
    - 44
    - 105

env:
  PUID: "1000"
  PGID: "1000"
  TZ: Asia/Kolkata

persistence:
  config:
    enabled: true
    size: 32Gi
    storageClassName: longhorn

media:
  enabled: true
  existingClaim: media-vault-pvc
  readOnly: true
  mounts:
    - mountPath: /data/english
      subPath: Movies/English Movies HD
    - mountPath: /data/english-uhd
      subPath: Movies/English Movies UHD
    - mountPath: /data/tamil-uhd
      subPath: Movies/Tamil Movies UHD
    - mountPath: /data/tamil
      subPath: Movies/Tamil Movies HD
    - mountPath: /tv
      subPath: Shows/Shows
    - mountPath: /anime
      subPath: Shows/Anime
    - mountPath: /data/music
      subPath: Music

hostDevices:
  enabled: true
  devices:
    - name: dri
      hostPath: /dev/dri
      mountPath: /dev/dri

httpRoute:
  enabled: true
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - jellyfin.k8s.harish2k01.xyz

resources: {}
envFrom: []
startupProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 90

# Upgrade/configuration notes for chart 0.2.0:
# startupProbe now allows 15 minutes for database migrations; back up the complete /config PVC.
# Keep existing media/GPU mounts and permissions. Hardware acceleration options remain app-managed.
# Full supported runtime options: https://github.com/harish2k01/helm-charts/blob/main/charts/jellyfin/values.yaml
# App/chart changes: https://github.com/harish2k01/helm-charts/blob/main/charts/jellyfin/CHANGELOG.md
