name: Update App Version
on:
  workflow_call:
    inputs:
      runner:
        required: false
        default: homelab-ops-runner
        type: string
      app_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      image_digest:
        required: false
        default: ""
        type: string
        description: "Exact published SHA-256 digest; changes trigger a rollout even for the same tag"
    secrets:
      GH_APP_ID:
        required: true
      GH_APP_PRIVATE_KEY:
        required: true
permissions:
  contents: read
concurrency:
  group: update-version-${{ inputs.app_name }}
  cancel-in-progress: false
jobs:
  update-app-version:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    env:
      APP_NAME: ${{ inputs.app_name }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: harish2k01
          repositories: homelab-ops
          permission-contents: write
      - name: Checkout homelab-ops
        uses: actions/checkout@v4
        with:
          repository: harish2k01/homelab-ops
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install yq
        run: |
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64 -o "$RUNNER_TEMP/yq"
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Update deployment image identity
        run: node .github/scripts/update-version.mjs
      - name: Commit only changed deployment values
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$APP_SLUG[bot]@users.noreply.github.com"
          git add "charts/$APP_NAME/values.yaml"
          if [ -f "charts/$APP_NAME/Chart.yaml" ]; then git add "charts/$APP_NAME/Chart.yaml"; fi
          if git diff --cached --quiet; then
            echo 'Deployment already uses this image. No Git commit or rollout.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "chore($APP_NAME): deploy $IMAGE_TAG${IMAGE_DIGEST:+ at $IMAGE_DIGEST}"
          # Updates for different apps may finish together. Preserve their commits.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo 'Could not push deployment update after three attempts.' >&2
          exit 1
