name: Build RailWatch runner image
on:
  pull_request:
    paths:
      - images/railwatch-runner/**
      - .github/workflows/runner-image.yaml
  push:
    branches: [main]
    paths:
      - images/railwatch-runner/**
      - .github/workflows/runner-image.yaml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Image builds need Docker, which the homelab-ops runner does not have; this public
    # repository builds on a GitHub-hosted runner instead.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/harish2k01/railwatch-runner
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        run: |
          version="$(sed -n 's/^ARG RUNNER_VERSION=//p' images/railwatch-runner/Dockerfile)"
          echo "tags=$IMAGE:$version-${GITHUB_SHA::7},$IMAGE:latest" >> "$GITHUB_OUTPUT"
      - name: Build (and push from main)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/railwatch-runner
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=ARC runner for RailWatch CI
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Pin \`$IMAGE@$DIGEST\` in railwatch-values.yaml." >> "$GITHUB_STEP_SUMMARY"
