name: Build runner images
on:
  pull_request:
    paths:
      - images/**
      - .github/workflows/runner-image.yaml
  push:
    branches: [main]
    paths:
      - images/**
      - .github/workflows/runner-image.yaml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Image builds need Docker, which the homelab-ops runner does not have; this public
    # repository builds on a GitHub-hosted runner instead.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One image per distinct toolset (directory under images/).
          - name: railwatch-runner
            description: ARC runner for RailWatch CI
          - name: ci-runner
            description: General ARC runner for the homelab repositories
    env:
      IMAGE: ghcr.io/harish2k01/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        run: |
          version="$(sed -n 's/^ARG RUNNER_VERSION=//p' "images/${{ matrix.name }}/Dockerfile")"
          echo "tags=$IMAGE:$version-${GITHUB_SHA::7},$IMAGE:latest" >> "$GITHUB_OUTPUT"
      - name: Build (and push outside pull requests)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/${{ matrix.name }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=${{ matrix.description }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Record digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Pin \`$IMAGE@$DIGEST\` in the runner values files." >> "$GITHUB_STEP_SUMMARY"
