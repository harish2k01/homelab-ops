name: GitOps PR Preview
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: gitops-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'homelab-ops-runner' || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Require trusted repository branch for cluster preview
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo 'Cluster previews require a maintainer-owned branch in this repository.' >&2
          exit 1
      - name: Resolve current PR revisions
        id: revisions
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data: pull} = await github.rest.pulls.get({owner, repo, pull_number: context.payload.pull_request.number});
            if (pull.state !== 'open' || pull.head.sha !== context.payload.pull_request.head.sha) {
              throw new Error('Superseded preview: the pull request is closed or its head has changed');
            }
            const {data: base} = await github.rest.git.getRef({owner, repo, ref: `heads/${pull.base.ref}`});
            core.setOutput('base', base.object.sha);
            core.setOutput('head', pull.head.sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.revisions.outputs.base }}
          path: workflow
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.revisions.outputs.head }}
          fetch-depth: 0
          path: ops
          persist-credentials: false
      - name: Create friday-pa token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FRIDAY_PA_APP_ID }}
          private-key: ${{ secrets.FRIDAY_PA_PRIVATE_KEY }}
      - name: Mark previous output stale
        uses: actions/github-script@v7
        env:
          GITOPS_COMMENT_MODE: pending
          GITOPS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await require('./workflow/.github/scripts/gitops-comments.cjs')({github, context, core});
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workflow/.github/scripts/requirements-gitops.txt
      - run: python -m pip install --disable-pip-version-check -r workflow/.github/scripts/requirements-gitops.txt
      - name: Plan affected Applications without cluster access
        id: plan
        continue-on-error: true
        env:
          GITHUB_BASE_SHA: ${{ steps.revisions.outputs.base }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: ops
        run: python ../workflow/.github/scripts/gitops-pr-preview.py --plan-only --output ../gitops-preview.md
      - uses: azure/setup-helm@v5
        if: steps.plan.outputs.has_changes == 'true'
        with:
          version: v3.18.4
      - uses: azure/setup-kubectl@v4
        if: steps.plan.outputs.has_changes == 'true'
        with:
          version: v1.35.3
      - name: Restore pinned Argo CD CLI
        continue-on-error: true
        if: steps.plan.outputs.has_changes == 'true'
        id: argocd-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/gitops-tool-cache/argocd
          key: ${{ runner.os }}-${{ runner.arch }}-argocd-v3.4.6-${{ hashFiles('workflow/.github/scripts/install-argocd.sh', 'workflow/.github/scripts/gitops-download.sh') }}
      - name: Install Argo CD CLI
        if: steps.plan.outputs.has_changes == 'true'
        env:
          ARGOCD_VERSION: v3.4.6
        run: bash workflow/.github/scripts/install-argocd.sh
      - name: Save verified Argo CD CLI
        continue-on-error: true
        if: steps.plan.outputs.has_changes == 'true' && steps.argocd-cache.outputs.cache-primary-key != '' && steps.argocd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/gitops-tool-cache/argocd
          key: ${{ steps.argocd-cache.outputs.cache-primary-key }}
      - name: Restore pinned dyff
        continue-on-error: true
        if: steps.plan.outputs.has_changes == 'true'
        id: dyff-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/gitops-tool-cache/dyff
          key: ${{ runner.os }}-${{ runner.arch }}-dyff-v1.12.0-${{ hashFiles('workflow/.github/scripts/install-dyff.sh', 'workflow/.github/scripts/gitops-download.sh') }}
      - name: Install dyff
        if: steps.plan.outputs.has_changes == 'true'
        run: bash workflow/.github/scripts/install-dyff.sh
      - name: Save verified dyff
        continue-on-error: true
        if: steps.plan.outputs.has_changes == 'true' && steps.dyff-cache.outputs.cache-primary-key != '' && steps.dyff-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/gitops-tool-cache/dyff
          key: ${{ steps.dyff-cache.outputs.cache-primary-key }}
      - name: Generate GitOps preview
        if: steps.plan.outputs.has_changes == 'true'
        id: render
        continue-on-error: true
        env:
          GITHUB_BASE_SHA: ${{ steps.revisions.outputs.base }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_CORE: ${{ vars.ARGOCD_CORE }}
          ARGOCD_GRPC_WEB: ${{ vars.ARGOCD_GRPC_WEB }}
          ARGOCD_INSECURE: ${{ vars.ARGOCD_INSECURE }}
          ARGOCD_PLAINTEXT: ${{ vars.ARGOCD_PLAINTEXT }}
          GITOPS_KUBE_VERSION: ${{ vars.GITOPS_KUBE_VERSION }}
          GITOPS_API_VERSIONS: ${{ vars.GITOPS_API_VERSIONS }}
        working-directory: ops
        run: python ../workflow/.github/scripts/gitops-pr-preview.py --output ../gitops-preview.md
      - name: Upload complete comparisons
        if: always() && steps.app-token.outcome == 'success'
        id: artifact
        uses: actions/upload-artifact@v6
        with:
          name: gitops-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ops/gitops-rendered-output
          overwrite: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish preview result
        if: always() && steps.app-token.outcome == 'success'
        uses: actions/github-script@v7
        env:
          GITOPS_COMMENT_MODE: preview
          GITOPS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITOPS_BASE_SHA: ${{ steps.revisions.outputs.base }}
          GITOPS_PREVIEW_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await require('./workflow/.github/scripts/gitops-comments.cjs')({github, context, core});
      - name: Require complete successful preview
        if: always()
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          HAS_CHANGES: ${{ steps.plan.outputs.has_changes }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
        run: |
          test "$PLAN_OUTCOME" = success
          if [ "$HAS_CHANGES" = true ]; then
            test "$RENDER_OUTCOME" = success
          else
            test "$HAS_CHANGES" = false
          fi
