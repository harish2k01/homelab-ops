name: GitOps PR Preview
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: gitops-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'homelab-ops-runner' || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Require trusted repository branch for cluster preview
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo 'Cluster previews require a maintainer-owned branch in this repository.' >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: workflow
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: ops
          persist-credentials: false
      - name: Create friday-pa token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FRIDAY_PA_APP_ID }}
          private-key: ${{ secrets.FRIDAY_PA_PRIVATE_KEY }}
      - name: Mark previous output stale
        uses: actions/github-script@v7
        env:
          GITOPS_COMMENT_MODE: pending
          GITOPS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await require('./workflow/.github/scripts/gitops-comments.cjs')({github, context, core});
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r workflow/.github/scripts/requirements-gitops.txt
      - uses: azure/setup-helm@v5
        with:
          version: v3.18.4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.3
      - name: Install Argo CD CLI
        env:
          ARGOCD_VERSION: v3.4.6
        run: bash workflow/.github/scripts/install-argocd.sh
      - name: Install dyff
        run: bash workflow/.github/scripts/install-dyff.sh
      - name: Generate GitOps preview
        id: render
        continue-on-error: true
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_CORE: ${{ vars.ARGOCD_CORE }}
          ARGOCD_GRPC_WEB: ${{ vars.ARGOCD_GRPC_WEB }}
          ARGOCD_INSECURE: ${{ vars.ARGOCD_INSECURE }}
          ARGOCD_PLAINTEXT: ${{ vars.ARGOCD_PLAINTEXT }}
          GITOPS_KUBE_VERSION: ${{ vars.GITOPS_KUBE_VERSION }}
          GITOPS_API_VERSIONS: ${{ vars.GITOPS_API_VERSIONS }}
        working-directory: ops
        run: python ../workflow/.github/scripts/gitops-pr-preview.py --output ../gitops-preview.md
      - name: Upload complete comparisons
        if: always() && steps.app-token.outcome == 'success'
        id: artifact
        uses: actions/upload-artifact@v6
        with:
          name: gitops-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ops/gitops-rendered-output
          overwrite: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish preview result
        if: always() && steps.app-token.outcome == 'success'
        uses: actions/github-script@v7
        env:
          GITOPS_COMMENT_MODE: preview
          GITOPS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITOPS_PREVIEW_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await require('./workflow/.github/scripts/gitops-comments.cjs')({github, context, core});
      - name: Require complete successful preview
        if: always()
        env:
          RENDER_OUTCOME: ${{ steps.render.outcome }}
        run: test "$RENDER_OUTCOME" = success
