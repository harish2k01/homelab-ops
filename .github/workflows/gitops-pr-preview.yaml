name: GitOps PR Preview

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "argocd-apps/**"
      - "charts/**"
      - "infra/**"
      - "manifests/**"
      - ".github/scripts/gitops-pr-preview.py"
      - ".github/workflows/gitops-pr-preview.yaml"

permissions:
  contents: read
  pull-requests: read

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: homelab-ops-runner

    steps:
      - name: Create friday-pa token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FRIDAY_PA_APP_ID }}
          private-key: ${{ secrets.FRIDAY_PA_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout workflow code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}
          path: workflow

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          path: ops

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Install Argo CD CLI
        run: |
          if command -v argocd >/dev/null 2>&1; then
            argocd version --client
            exit 0
          fi

          sudo curl -sSL \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64 \
            -o /usr/local/bin/argocd
          sudo chmod +x /usr/local/bin/argocd
          argocd version --client

      - name: Install Helm CLI
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Generate GitOps preview
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_CORE: ${{ vars.ARGOCD_CORE }}
          ARGOCD_GRPC_WEB: ${{ vars.ARGOCD_GRPC_WEB }}
          ARGOCD_INSECURE: ${{ vars.ARGOCD_INSECURE }}
          ARGOCD_PLAINTEXT: ${{ vars.ARGOCD_PLAINTEXT }}
          ARGOCD_DIFF_REFRESH: ${{ vars.ARGOCD_DIFF_REFRESH }}
        working-directory: ops
        run: python ../workflow/.github/scripts/gitops-pr-preview.py --output ../gitops-preview.md

      - name: Upload complete rendered output
        id: rendered-output
        uses: actions/upload-artifact@v6
        with:
          name: gitops-rendered-output
          path: ops/gitops-rendered-output
          if-no-files-found: ignore
          retention-days: 7

      - name: Upsert PR comment
        uses: actions/github-script@v7
        env:
          GITOPS_PREVIEW_ARTIFACT_URL: ${{ steps.rendered-output.outputs.artifact-url }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const artifactUrl = process.env.GITOPS_PREVIEW_ARTIFACT_URL || '#';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            async function upsert(marker, body) {
              const existing = comments.find(
                (comment) => comment.body && comment.body.includes(marker),
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
                return;
              }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

            const summaryMarker = '<!-- friday-pa:argocd-diff -->';
            const summaryBody = fs
              .readFileSync('gitops-preview.md', 'utf8')
              .replaceAll('{{GITOPS_PREVIEW_ARTIFACT_URL}}', artifactUrl);
            await upsert(summaryMarker, summaryBody);

            const newAppDirectory = 'ops/gitops-new-app-comments';
            const desiredNewAppMarkers = new Set();
            const newAppFiles = fs.existsSync(newAppDirectory)
              ? fs.readdirSync(newAppDirectory).filter((name) => name.endsWith('.md')).sort()
              : [];

            for (const file of newAppFiles) {
              const body = fs
                .readFileSync(`${newAppDirectory}/${file}`, 'utf8')
                .replaceAll('{{GITOPS_PREVIEW_ARTIFACT_URL}}', artifactUrl);
              const marker = body.match(/<!-- friday-pa:argocd-new-app:[^>]+ -->/)?.[0];
              if (!marker) {
                core.setFailed(`New-app comment ${file} has no friday-pa marker`);
                return;
              }
              desiredNewAppMarkers.add(marker);
              await upsert(marker, body);
            }

            for (const comment of comments) {
              const marker = comment.body?.match(/<!-- friday-pa:argocd-new-app:[^>]+ -->/)?.[0];
              const appSlug = comment.performed_via_github_app?.slug;
              if (marker && appSlug === 'friday-pa' && !desiredNewAppMarkers.has(marker)) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: comment.id,
                });
              }
            }
