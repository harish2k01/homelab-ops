name: Validate version updater
on:
  pull_request:
    paths:
      - .github/scripts/update-version*.mjs
      - .github/scripts/install-yq.sh
      - .github/workflows/update-version*.yaml
  push:
    branches: [main]
    paths:
      - .github/scripts/update-version*.mjs
      - .github/scripts/install-yq.sh
      - .github/workflows/update-version*.yaml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'homelab-ops-runner' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install yq
        timeout-minutes: 12
        run: bash .github/scripts/install-yq.sh
      - run: node --test .github/scripts/update-version.test.mjs
